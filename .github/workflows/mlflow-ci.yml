name: MLflow CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Stage 1
      - name: Checkout repository
        uses: actions/checkout@v4

      # Stage 2
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      # Stage 3
      - name: Check Environment
        run: |
          python --version
          pip --version

      # Stage 4
      - name: Install dependencies
        run: |
          pip install --upgrade pip

          pip install mlflow
          pip install pandas
          pip install numpy
          pip install scikit-learn
          pip install matplotlib
          pip install seaborn
          pip install joblib

      # Stage 5
      - name: Run Model Training
        env:
          MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/MLProject/mlruns/mlflow.db
        run: |
          python MLProject/modelling.py

      # Stage 6
      - name: Get latest MLflow run_id
        id: runid
        run: |
          echo "RUN_ID=$(cat MLProject/artifacts/run_id.txt)" >> $GITHUB_OUTPUT

      # Stage 7
      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: salary-regression-artifacts
          path: |
            MLProject/artifacts/
            MLProject/mlruns/
          retention-days: 30

      # Stage 8
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Stage 9
      - name: Build Docker Model
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        env:
          MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/MLProject/mlruns/mlflow.db
        run: |
          mlflow models build-docker \
            -m "runs:/${{ steps.runid.outputs.RUN_ID }}/model" \
            -n salary-regression-ci

      # Stage 10
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Stage 11
      - name: Tag Docker Image
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          docker tag salary-regression-ci \
          ${{ secrets.DOCKERHUB_USERNAME }}/salary-regression-ci:latest

      # Stage 12
      - name: Push Docker Image
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/salary-regression-ci:latest