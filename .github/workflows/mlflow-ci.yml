name: MLflow CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  train-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.11'
          activate-environment: salary-regression-ci

      - name: Install project dependencies
        run: |
          conda env update -n salary-regression-ci -f MLProject/conda.yaml
          conda run -n salary-regression-ci python -m pip install --upgrade pip

      - name: Run MLflow project training
        env:
          MLFLOW_TRACKING_URI: sqlite:///MLProject/mlruns/mlflow.db
        run: |
          mkdir -p MLProject/mlruns MLProject/artifacts
          conda run -n salary-regression-ci mlflow run MLProject --env-manager conda

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: salary-regression-artifacts
          path: |
            MLProject/artifacts/
            MLProject/mlruns/

      - name: Read MLflow run ID
        id: mlflow_run
        run: |
          echo "RUN_ID=$(tr -d '\n' < MLProject/artifacts/run_id.txt)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/salary-regression-ci:latest
          RUN_ID: ${{ steps.mlflow_run.outputs.RUN_ID }}
        run: |
          conda run -n salary-regression-ci mlflow models build-docker -m "runs:/${RUN_ID}/model" -n "$IMAGE_NAME"
          docker push "$IMAGE_NAME"
