name: MLflow CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Stage 1
      - name: Checkout repository
        uses: actions/checkout@v4

      # Stage 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stage 3
      - name: Check Environment
        run: |
          python --version
          pip --version

      # Stage 3.5
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          miniconda-version: "latest"
          auto-activate-base: true

      # Stage 4
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow pandas numpy scikit-learn matplotlib seaborn joblib dagshub

      # Stage 5
      - name: Run Model Training
        shell: bash -l {0}
        env:
          MLFLOW_TRACKING_URI: "file:${{ github.workspace }}/mlruns"
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          mlflow run ./MLProject

      # Stage 6
      - name: Get Latest MLflow Run ID
        id: runid
        run: |
          cat MLProject/artifacts/run_id.txt
          echo "RUN_ID=$(cat MLProject/artifacts/run_id.txt)" >> $GITHUB_OUTPUT

      # Stage 6.5
      - name: Verify Artifacts Exist
        shell: bash -l {0}
        env:
          MLFLOW_TRACKING_URI: "file:${{ github.workspace }}/mlruns"
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          echo "=== Checking artifact locations ==="
          echo "Contents of root mlruns:"
          ls -la mlruns/ 2>/dev/null || echo "No root mlruns directory"
          echo ""
          echo "Contents of MLProject/mlruns:"
          ls -la MLProject/mlruns/ 2>/dev/null || echo "No MLProject/mlruns directory"
          echo ""
          echo "Contents of MLProject/artifacts:"
          ls -la MLProject/artifacts/ 2>/dev/null || echo "No MLProject/artifacts directory"
          echo ""
          echo "RUN_ID: ${{ steps.runid.outputs.RUN_ID }}"
          echo "Looking for model in runs directory..."
          find . -type f -name "MLmodel" 2>/dev/null || echo "No MLmodel file found"

      # Stage 7
      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: salary-regression-artifacts
          path: |
            MLProject/artifacts/
            mlruns/
            MLProject/mlruns/
          retention-days: 30

      # Stage 8
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Stage 9
      - name: Build Docker Model
        shell: bash -l {0}
        env:
          MLFLOW_TRACKING_URI: "file:${{ github.workspace }}/mlruns"
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          echo "RUN_ID=${{ steps.runid.outputs.RUN_ID }}"

          mlflow models build-docker \
            -m "runs:/${{ steps.runid.outputs.RUN_ID }}/model" \
            -n salary-regression-ci

      # Stage 10
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Stage 11
      - name: Tag Docker Image
        run: |
          docker tag salary-regression-ci \
          ${{ secrets.DOCKERHUB_USERNAME }}/salary-regression-ci:latest

      # Stage 12
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/salary-regression-ci:latest