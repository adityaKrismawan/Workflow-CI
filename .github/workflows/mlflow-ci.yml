name: MLflow CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  train-and-upload:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Stage 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.11'
          activate-environment: salary-regression-ci

      - name: Stage 3 - Install dependencies
        run: |
          conda env update -n salary-regression-ci -f MLProject/conda.yaml
          conda run -n salary-regression-ci python -m pip install --upgrade pip

      - name: Stage 4 - Train model with MLflow
        run: |
          export MLFLOW_TRACKING_URI="sqlite:///${GITHUB_WORKSPACE}/MLProject/mlruns/mlflow.db"
          export MLFLOW_DISABLE_ENV_MANAGER_CONDA_WARNING="TRUE"
          mkdir -p MLProject/mlruns MLProject/artifacts
          conda run -n salary-regression-ci mlflow run MLProject --env-manager conda

      - name: Stage 5 - Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: salary-regression-artifacts
          path: |
            MLProject/artifacts/
            MLProject/mlruns/

      - name: Stage 6 - Capture MLflow run ID
        id: mlflow_run
        run: |
          echo "RUN_ID=$(tr -d '\n' < MLProject/artifacts/run_id.txt)" >> "$GITHUB_OUTPUT"

      - name: Stage 7 - Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Stage 8 - Build and push Docker image
          if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        env:
          IMAGE_NAME: ${{ env.DOCKERHUB_USERNAME }}/salary-regression-ci:latest
          RUN_ID: ${{ steps.mlflow_run.outputs.RUN_ID }}
          MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/MLProject/mlruns/mlflow.db
        run: |
          echo "Using RUN_ID=$RUN_ID"
          
          conda run -n salary-regression-ci mlflow models build-docker 
          -m "runs:/${RUN_ID}/model" 
          -n "$IMAGE_NAME"
          
          docker push "$IMAGE_NAME"
